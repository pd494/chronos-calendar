name: Test

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  data-permissions:
    name: Data permissions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check permission tests
        run: npm run typecheck:test

      - name: Test InstantDB permissions
        run: npm run test:data-permissions

  mobile-app:
    name: Mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint TypeScript and React Native
        run: npm run lint

      - name: Lint Effect usage
        run: npm run lint:effect

      - name: Type-check mobile app
        run: npm run typecheck

      - name: Bundle Android app
        run: npx expo export --platform android --output-dir /tmp/chronos-mobile-export
